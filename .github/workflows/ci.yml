name: AI foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.6
      - run: python -m uv sync --locked
      - run: make lint typecheck test contracts dataset-check ingestion-demo retrieval-eval-check mapping-eval-check
      - run: python -m uv run --frozen python -m vmarket_ai.evaluation.regression --output .local/p13-ci
      - run: python -m uv run --frozen python evals/p13/verify.py --compare .local/p13-ci
      - run: python -m uv run --frozen python -m vmarket_ai.evaluation.new_questions
      - run: python -m uv run --frozen python tools/p13_new_verify.py --artifact evals/p13/runs/new-questions-v1
      - run: docker compose config --quiet
      - run: docker compose -p ai-ci up -d --wait ai-postgres
      - name: Migrate isolated AI storage
        env:
          AI_DATABASE_URL: postgresql+psycopg://ai_app:local-ai-app-only@127.0.0.1:5434/vmarket_ai
          AI_MIGRATION_DATABASE_URL: postgresql+psycopg://ai_owner:local-ai-owner-only@127.0.0.1:5434/vmarket_ai
        run: python -m uv run --frozen vmarket-ai migrate
      - name: Real PostgreSQL permissions and extension test
        env:
          AI_TEST_DATABASE_URL: postgresql+psycopg://ai_app:local-ai-app-only@127.0.0.1:5434/vmarket_ai
          AI_TEST_OWNER_DATABASE_URL: postgresql+psycopg://ai_owner:local-ai-owner-only@127.0.0.1:5434/vmarket_ai
        run: python -m uv run --frozen pytest -q -m postgres
      - run: docker compose -p ai-ci build ai-api
      - if: always()
        run: docker compose -p ai-ci down
